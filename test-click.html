<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static Click Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        
        .container {
            background: white;
            padding: 2rem;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        
        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #111827;
            margin-bottom: 1.5rem;
        }
        
        .count {
            font-size: 2rem;
            font-weight: 700;
            color: #3b82f6;
            margin-bottom: 1.5rem;
        }
        
        .btn {
            background: #3b82f6;
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.25rem;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
        }
        
        .btn:hover {
            background: #2563eb;
        }
        
        .btn:active {
            background: #1d4ed8;
        }
        
        .info {
            margin-top: 1rem;
            color: #6b7280;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Static Click Test</h1>
        <div class="count" id="count">0</div>
        <button class="btn" id="clickBtn">Click Me</button>
        <div class="info">
            Open browser console to see click events
        </div>
    </div>

    <script>
        console.log('Static test page loaded');
        
        const btn = document.getElementById('clickBtn');
        const countDisplay = document.getElementById('count');
        let count = 0;
        
        console.log('Button element:', btn);
        
        // Direct DOM event listener
        btn.addEventListener('click', (e) => {
            console.log('Direct DOM click event:', e);
            count++;
            countDisplay.textContent = count;
            console.log('Count updated to:', count);
        });
        
        // Global click listener
        document.addEventListener('click', (e) => {
            console.log('Global click event:', e.target);
        });
    </script>
</body>
</html>
