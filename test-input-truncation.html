<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Truncation Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        
        .login-form-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .login-input-container {
            background-color: #4f46e5;
            padding: 2rem;
            border-radius: 0.5rem;
        }
        
        .text-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            font-size: 1rem;
            background-color: #ffffff;
        }
        
        .text-input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
        }
        
        .relative {
            position: relative;
        }
        
        .w-full {
            width: 100%;
        }
    </style>
</head>
<body class="bg-gray-100">
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="login-form-container bg-white rounded-xl shadow-2xl overflow-hidden">
            <div class="grid grid-cols-1 md:grid-cols-2">
                <!-- Branding Panel -->
                <div class="bg-white p-8">
                    <div class="max-w-md mx-auto">
                        <div class="text-center mb-8">
                            <div class="w-20 h-20 mx-auto mb-4 rounded-full bg-indigo-100 border-2 border-indigo-500 flex items-center justify-center shadow-md">
                                <svg class="w-10 h-10 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                                </svg>
                            </div>
                            <h1 class="text-3xl font-bold text-gray-900 mb-2">IMMUNICARE</h1>
                            <p class="text-gray-600">Infant Vaccination & Inventory</p>
                            <div class="h-1 w-16 bg-red-500 rounded-full mx-auto mt-4"></div>
                        </div>

                        <p class="text-gray-600 mb-6">
                            Track immunization schedules and receive reminders for your child's vaccinations.
                        </p>

                        <div class="text-center">
                            <button class="text-indigo-600 hover:text-indigo-800 font-semibold transition-colors">
                                Switch to Admin Portal
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Login Form -->
                <div class="bg-gradient-to-br from-indigo-600 to-indigo-700 p-8 text-white">
                    <div class="w-full">
                        <div class="text-center mb-8">
                            <div class="w-20 h-20 mx-auto mb-4 rounded-full bg-white/10 backdrop-blur-sm flex items-center justify-center shadow-lg">
                                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                                </svg>
                            </div>
                            <h2 class="text-3xl font-bold">Guardian Login</h2>
                            <p class="text-white/80 mt-2">
                                Access your infant's vaccination records
                            </p>
                        </div>

                        <form class="space-y-5 w-full">
                            <div class="login-input-container w-full">
                                <div class="relative">
                                    <div class="text-input-icon">
                                        <svg class="w-5 h-5 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                                        </svg>
                                    </div>
                                    <input 
                                        type="text" 
                                        placeholder="Email or Guardian ID" 
                                        class="text-input pl-10"
                                    />
                                </div>
                            </div>

                            <div class="login-input-container w-full">
                                <div class="relative">
                                    <div class="text-input-icon">
                                        <svg class="w-5 h-5 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                                        </svg>
                                    </div>
                                    <input 
                                        type="password" 
                                        placeholder="Password" 
                                        class="text-input pl-10"
                                    />
                                </div>
                            </div>

                            <div class="flex justify-end">
                                <a href="#" class="text-sm text-red-300 hover:text-red-200 font-bold transition-colors">
                                    Forgot Password?
                                </a>
                            </div>

                            <button 
                                type="submit" 
                                class="w-full bg-red-600 hover:bg-red-700 py-4 rounded-lg text-base font-bold shadow-lg hover:shadow-xl transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 text-white"
                            >
                                Sign in
                            </button>
                        </form>

                        <div class="mt-8 text-center">
                            <p class="text-white/70">
                                Don't have an account? 
                                <a href="#" class="text-white font-bold hover:underline">
                                    Register here
                                </a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        // Debug function to log input dimensions
        function logInputDimensions() {
            const inputs = document.querySelectorAll('.text-input');
            inputs.forEach((input, index) => {
                const rect = input.getBoundingClientRect();
                console.log(`Input ${index + 1} dimensions:`, {
                    width: rect.width,
                    height: rect.height,
                    computedWidth: window.getComputedStyle(input).width,
                    computedMaxWidth: window.getComputedStyle(input).maxWidth,
                    parentWidth: input.parentElement.getBoundingClientRect().width
                });
            });
        }

        // Log dimensions when the page loads and on resize
        window.addEventListener('load', logInputDimensions);
        window.addEventListener('resize', logInputDimensions);

        // Test function to set long values in inputs
        function testInputTruncation() {
            const inputs = document.querySelectorAll('.text-input');
            inputs[0].value = 'john.doe@example.com';
            inputs[1].value = 'password123';
            logInputDimensions();
        }

        // Run test after page loads
        window.addEventListener('load', () => {
            setTimeout(testInputTruncation, 1000);
        });
    </script>
</body>
</html>
